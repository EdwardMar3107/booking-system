server:
  port: 8080

spring:

  application:
    name: gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/event/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/booking/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/payment/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notification/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG